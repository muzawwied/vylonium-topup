<!doctype html><html><head><meta charset="utf-8">
<style>
body{background:#0f1115;display:flex;gap:36px;flex-wrap:wrap;padding:50px;align-items:center;font-family:sans-serif}
.dark{background:#0f1115}.light{background:#fff}
.big svg{width:150px;height:122px}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:8px}
.hdr svg{width:32px;height:26px}
.hdr span{font-weight:800;font-size:20px;letter-spacing:-.03em}
.dark .hdr span{color:#fff}.light .hdr span{color:#111}
</style></head>
<body>
<!-- VAR A: stroke V miring + gamepad tilt + diamond float -->
<div class="big dark"><svg viewBox="0 0 41 31">

</defs>
<g transform="rotate(-8 19 15.5)">
<path d="M3.5 4.5 C9 4.5 12.5 12.5 16.2 26.5" fill="none" stroke="url(#vg)" stroke-width="5.2" stroke-linecap="round"/>
